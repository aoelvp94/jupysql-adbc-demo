[project]
name = "jupysql-adbc-demo"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "jupysql",
  "adbc-driver-manager",
  "adbc-driver-postgresql",
  "adbc-driver-sqlite",
  "duckdb",
  "duckdb-engine",
  "sqlalchemy",
  "psycopg2-binary",
  "polars",
  "pyarrow",
  "pytest",
  "ipython",
  "ipykernel",
  "nbconvert",
  "nbformat",
  "pandas",
  "matplotlib",
  "psutil",
  "pytz",
]

[tool.uv.sources]
jupysql = { path = "jupysql", editable = true }
