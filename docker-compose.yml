services:
  postgres:
    image: postgres:17
    container_name: jadbc-pg
    ports:
      - "55433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bench"]
      interval: 2s
      timeout: 5s
      retries: 20
